[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blc"
version = "1.9.0"
description = "Bridge Load Calculator – přechodnost vozidel MLC vs Ve a vnitřní síly g0, g−g0, q pro posudek nosníku (1D + 2D MKP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Samuel Banas" }]
dependencies = ["numpy", "scipy", "matplotlib", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
blc = "blc.__main__:main"
blc-posudek = "blc_posudek.__main__:main"

[tool.setuptools]
packages = ["blc", "pb_posudek", "blc_posudek"]

[tool.setuptools.package-data]
blc = ["data/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
