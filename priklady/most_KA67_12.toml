# ---- Most a zatížení (BLC) – karta 0 ----
# Zatížení nosníku ([zatizeni]) se nezadává: vytvoří se z obálek vnitřních sil
# nejzatíženějšího nosníku. Rozpětí L0, délka L, beton a průřez (A, Iy) se berou z posudku.
[blc]
typ_konstrukce = "nosniky"
N = 10                       # počet nosníků
b = 1.0                      # šířka nosníku v mostovce (rozteč) [m]
prurez_z_posudku = true      # A a Iy nosníku z karty Průřez
nu = 0.2
d = 0.55                     # statická účinná výška [m]
spara = false
alfa = 90.0
sikmost = "prava"
k_v = 2000.0                 # [MN/m na 1 m podpory]; 0 = tuhá
uloz = "tvrde"
spoj = "kloub"
chodnik_L = 1.5              # [m]
chodnik_P = 0.75             # [m]
g_chodnik = 5.0              # [kN/m²]
g_vozovka = 2.6              # [kN/m²]
g_zabradli = 0.5             # [kN/m] každá strana
g_svodidla = 0.6             # [kN/m] každá strana
q_chodnik = 3.0              # zatížení chodců [kN/m²]
vozidlo = "Ve"               # "Ve" | "MLC_k" | "MLC_p"
Ve = 80.0                    # [t]
MLC = "MLC80"
dyn = 1.0
roznos = true
t_voz = 0.0
krok = 0.25
ex = 0.125
vystup = "auto"              # "auto" = nejzatíženější nosník, jinak např. "N6"
kriterium = "M"              # "M" | "M-" | "V"
rezim = "kombinace"          # "kombinace" | "zatezovaci_stavy"
gamma_Q = 1.35
psi0 = 0.75
psi1 = 0.75
psi2 = 0.0
gamma_Qch = 1.35             # chodci
psi0_ch = 0.75
psi1_ch = 0.75
psi2_ch = 0.0
t_vneseni = 60.0             # kvazistálá kombinace působí od stáří [dny]
